{% extends "base.html" %}
{% block content %}
  <h2>All Questions</h2>
  <ul class="list-group">
    {% for q in questions %}
      <li class="list-group-item">
        <strong>{{ q.question }}</strong><br>
        Your answer: {{ q.user_answer if q.user_answer else "No answer" }}
      </li>
    {% endfor %}
  </ul>
  <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Back to home</a>
{% endblock %}
